name: Unity CI

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  architecture:
    name: Architecture guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check architecture contracts
        run: python tools/check-architecture.py
      - name: Check Chapter I gameplay acceptance contracts
        run: python tools/check-chapter1-gameplay-acceptance.py

  tests:
    name: Unity ${{ matrix.testMode }} tests
    needs: architecture
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check Unity activation configuration
        shell: bash
        run: |
          if [ -z "${UNITY_LICENSE:-}" ] && { [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; }; then
            echo "Unity activation is not configured in repository Actions secrets."
            echo "Configure a supported GameCI Unity activation method before Unity tests can run."
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}-${{ matrix.testMode }}
          restore-keys: |
            Library-${{ runner.os }}-
      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4.4.0
        with:
          projectPath: .
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: artifacts/${{ matrix.testMode }}
          checkName: Unity ${{ matrix.testMode }} tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-${{ matrix.testMode }}-results
          path: artifacts/${{ matrix.testMode }}
          if-no-files-found: ignore

  build:
    name: Windows build
    needs: tests
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-build-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-build-${{ runner.os }}-
            Library-${{ runner.os }}-
      - name: Build Windows player
        uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          targetPlatform: StandaloneWindows64
          buildName: TheTroyGame
          buildsPath: Builds/CI
      - uses: actions/upload-artifact@v4
        with:
          name: TheTroyGame-Windows
          path: Builds/CI
